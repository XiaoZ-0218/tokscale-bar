name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Same gate as CI: never ship a release that fails the unit tests.
      - run: swift test

      # Universal (arm64 + x86_64) build; bundle version comes from the tag.
      - run: VERSION=${GITHUB_REF_NAME#v} ./build-app.sh --universal

      # The zip/dmg must contain a real universal binary.
      - name: Verify universal binary
        run: lipo -info TokscaleBar.app/Contents/MacOS/TokscaleBar | grep x86_64

      - name: Package zip
        run: ditto -c -k --sequesterRsrc --keepParent TokscaleBar.app "TokscaleBar-${GITHUB_REF_NAME}-macOS.zip"

      - name: Package dmg
        run: |
          mkdir dmg-staging
          cp -R TokscaleBar.app dmg-staging/
          ln -s /Applications dmg-staging/Applications
          # hdiutil is deprecated on the newest macOS but still works everywhere;
          # diskutil image create lacks --volumeName before macOS 26.
          hdiutil create -volname TokscaleBar -srcfolder dmg-staging -ov -format UDZO \
            "TokscaleBar-${GITHUB_REF_NAME}-macOS.dmg"

      # Creates the GitHub Release for the tag and uploads the app bundles.
      # Pinned to the v2.6.2 commit SHA: the floating v2 tag is mutable, so
      # referencing it would let a retag silently change what runs here.
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: TokscaleBar ${{ github.ref_name }}
          files: |
            TokscaleBar-${{ github.ref_name }}-macOS.dmg
            TokscaleBar-${{ github.ref_name }}-macOS.zip
          generate_release_notes: true
